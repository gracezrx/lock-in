<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Lock In: social preview</title>
    <!-- The repository's social preview (1280x640, the card links show on X and elsewhere):
           node scripts/demo/social/render.mjs   -> docs/social-preview.png -->
    <link rel="stylesheet" href="../../../dist/renderer/base.css" />
    <style>
      * { box-sizing: border-box; }
      html, body { width: 1280px; height: 640px; margin: 0; overflow: hidden; }
      body { position: relative; font-family: var(--body); color: #fff; background:
          radial-gradient(70% 90% at 8% 0%, rgba(255, 207, 0, 0.24) 0%, transparent 60%),
          radial-gradient(80% 90% at 100% 110%, rgba(255, 106, 61, 0.55) 0%, transparent 60%),
          linear-gradient(140deg, #221d44 0%, #351c45 55%, #552838 100%); }
      .left { position: absolute; left: 72px; top: 0; bottom: 0; width: 600px; display: flex; flex-direction: column; justify-content: center; }
      .logo { display: flex; align-items: center; gap: 22px; }
      .logo img { width: 104px; height: 104px; border-radius: 24px; box-shadow: 0 18px 40px rgba(0, 0, 0, 0.4); }
      .logo b { font-family: var(--display); font-weight: 900; font-size: 136px; line-height: 0.82; text-transform: uppercase; letter-spacing: 0.01em; }
      .tag { margin-top: 30px; font-family: var(--display); font-weight: 800; font-size: 46px; line-height: 1.02; text-transform: uppercase; letter-spacing: 0.015em; }
      .tag span { color: var(--yellow); }
      .what { margin-top: 20px; font-size: 23px; line-height: 1.4; font-weight: 500; color: rgba(255, 255, 255, 0.8); max-width: 540px; }
      .chips { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 26px; }
      .chips span { padding: 8px 15px 9px; border-radius: 999px; background: rgba(255, 255, 255, 0.1); box-shadow: inset 0 0 0 1px rgba(255, 255, 255, 0.18); font-size: 19px; font-weight: 600; }
      .chips span.y { background: var(--yellow); color: var(--ink); box-shadow: none; }
      .shot { position: absolute; }
      .shot img { display: block; width: 100%; }
      .card { border-radius: 14px; overflow: hidden; box-shadow: 0 30px 60px rgba(0, 0, 0, 0.45), 0 8px 18px rgba(0, 0, 0, 0.25); }
      .red { left: 735px; top: 120px; width: 470px; transform: rotate(3deg); }
      .toast { left: 690px; top: 70px; width: 420px; transform: rotate(-2.5deg); }
      .talking { position: absolute; left: 770px; top: 500px; display: flex; align-items: center; gap: 12px; height: 62px; padding: 0 20px 0 12px; border-radius: 14px; background: #101820; box-shadow: 0 16px 36px rgba(0, 0, 0, 0.45), inset 0 0 0 1px rgba(255, 255, 255, 0.1); transform: rotate(-1.5deg); }
      .talking img { width: 38px; height: 38px; border-radius: 9px; }
      .talking b { font-family: var(--display); font-weight: 800; font-size: 23px; text-transform: uppercase; }
      .talking b small { display: block; font-family: var(--body); font-size: 13px; font-weight: 600; text-transform: none; color: rgba(255, 255, 255, 0.6); }
      .bars { display: flex; align-items: center; gap: 5px; height: 36px; margin-left: 6px; }
      .bars i { width: 6px; border-radius: 3px; background: var(--yellow); }
      .url { position: absolute; left: 72px; bottom: 38px; font-size: 19px; font-weight: 600; color: rgba(255, 255, 255, 0.55); letter-spacing: 0.01em; }
    </style>
  </head>
  <body>
    <div class="left">
      <div class="logo"><img src="../../../assets/icon.png" alt="" /><b>Lock In</b></div>
      <div class="tag">You drift. It notices.<br /><span>It drags you back.</span></div>
      <div class="what">An AI focus coach for your Mac that nudges, talks, then yells you back to work. And talks back.</div>
      <div class="chips"><span class="y">Free</span><span>Open source</span><span>Mac + Chrome</span><span>Stays on your Mac</span></div>
    </div>
    <div class="shot card red"><img src="../tour/ui/card-red.jpg" alt="" /></div>
    <div class="shot card toast"><img src="../tour/ui/toast-nudge.jpg" alt="" /></div>
    <div class="talking"><img src="../../../assets/icon.png" alt="" /><b>Lock In<small>is talking</small></b><div class="bars"><i style="height:10px"></i><i style="height:22px"></i><i style="height:34px"></i><i style="height:18px"></i><i style="height:28px"></i><i style="height:12px"></i><i style="height:24px"></i><i style="height:8px"></i></div></div>
    <div class="url">github.com/gracezrx/lock-in</div>
  </body>
</html>
