<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      body { margin: 0; width: 270px; font: 13px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f3f4f1; color: #101820; }
      .wrap { padding: 16px; }
      h1 { display: flex; align-items: center; gap: 10px; margin: 0 0 10px; font-size: 17px; font-weight: 800; }
      h1 svg { width: 26px; height: 26px; flex: none; }
      .row { display: flex; align-items: center; gap: 8px; margin: 0 0 8px; font-weight: 600; }
      .dot { width: 9px; height: 9px; border-radius: 50%; background: #c9ccc5; }
      .dot.on { background: #1e7f4f; }
      p { margin: 0; color: #47515a; }
      button[hidden] { display: none; }
      button { width: 100%; margin-top: 14px; min-height: 34px; border: 1.5px solid #101820; border-radius: 6px; background: #101820; color: #fff; font-weight: 600; cursor: pointer; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <h1><svg viewBox="0 0 1024 1024" aria-hidden="true"><rect width="1024" height="1024" rx="230" fill="#111"/><g transform="translate(512 512) scale(0.82) translate(-512 -529)"><path d="M375 526V430a137 137 0 0 1 274 0V526" fill="none" stroke="#d4ff3a" stroke-width="70"/><rect x="292" y="486" width="440" height="314" rx="48" fill="#d4ff3a"/><circle cx="512" cy="615" r="42" fill="#111"/><rect x="491" y="622" width="42" height="94" rx="20" fill="#111"/></g></svg>Lock In</h1>
      <div class="row"><span class="dot" id="dot"></span><span id="status">Checking…</span></div>
      <p id="hint">The desktop app must be running for the coach to see your tabs.</p>
      <button id="retry" hidden>Reconnect</button>
    </div>
    <script src="popup.js"></script>
  </body>
</html>
