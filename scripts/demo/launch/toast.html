<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Corner card</title>
    <!-- The app's real corner card (toast.css), with the film's words. -->
    <link rel="stylesheet" href="/dist/renderer/base.css" />
    <link rel="stylesheet" href="/dist/renderer/toast.css" />
    <style>*, *::before, *::after { animation: none !important; transition: none !important; } html, body { width: 400px; }</style>
  </head>
  <body>
    <article class="toast" data-kind="nudge">
      <div class="stripe"></div>
      <div class="content">
        <header class="head"><h1 class="title">Drifting</h1><button class="close" type="button">×</button></header>
        <p class="body">Psst. Your goal called. It said “investor update”, not doomscroll.app.</p>
        <div class="actions"><button class="btn btn-ink" type="button">Back to it</button><button class="btn" type="button">I need a real break (7 min)</button></div>
      </div>
    </article>
  </body>
</html>
