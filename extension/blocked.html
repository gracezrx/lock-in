<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Locked in</title>
    <style>
      html, body { height: 100%; margin: 0; }
      body { display: grid; place-items: center; background: #101820; color: #fff; font: 17px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
      .card { width: min(520px, calc(100vw - 48px)); padding: 40px 44px; border-radius: 18px; background: #e5202e; transform: rotate(2deg); box-shadow: 0 30px 70px rgba(0,0,0,.45); }
      .mark { font-weight: 700; font-size: 14px; opacity: .85; margin-bottom: 14px; }
      h1 { font-size: 64px; line-height: .95; margin: 0 0 14px; font-weight: 900; letter-spacing: -0.01em; }
      p { margin: 0; opacity: .92; }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="mark">Red card from Lock In</div>
      <h1>Not now.</h1>
      <p id="msg">This site is blocked until your session ends. Your work is one tab away.</p>
    </div>
    <script src="blocked.js"></script>
  </body>
</html>
