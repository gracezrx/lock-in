# On-demand agent: mention @claude in an issue or PR comment and it picks the
# thread up. Same gates and skills as the night shift; a person still merges.
# Generated by agent-stack (/agent-workflow).

name: Claude

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  pull_request_review:
    types: [submitted]
  issues:
    types: [opened, assigned]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read

jobs:
  claude:
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          github_token: ${{ secrets.AGENT_GH_TOKEN || github.token }}
          claude_args: |
            --max-turns 60
            --max-budget-usd 6
            --allowedTools "Read,Edit,Write,Glob,Grep,Bash(git *),Bash(gh *),Bash(npm *),Bash(npx *),Bash(pnpm *),Bash(yarn *),Bash(bun *),Bash(node *),Bash(python *),Bash(python3 *),Bash(pip *),Bash(pytest *),Bash(uv *),Bash(cargo *),Bash(go *),Bash(swift *),Bash(xcodebuild *),Bash(xcrun *),Bash(psql *),Bash(cat *),Bash(ls *),Bash(mkdir *),Bash(cd *)"
            --append-system-prompt "Read CLAUDE.md first. Use the bugfix and prove skills. Every change needs evidence from the real product. Run all gates before pushing. Never merge; a person does that."
