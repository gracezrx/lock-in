<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Bomb card</title>
    <!-- The real full-screen card: the app's own overlay.css, driven frame by frame. -->
    <link rel="stylesheet" href="/dist/renderer/base.css" />
    <link rel="stylesheet" href="/dist/renderer/overlay.css" />
    <style>
      *, *::before, *::after { animation: none !important; transition: none !important; }
      html, body { width: 1280px; height: 800px; }
      .opt.pressed { transform: scale(0.96); }
    </style>
  </head>
  <body class="bomb">
    <div class="scrim" id="scrim"></div>
    <section class="card locked" id="card" data-level="4">
      <header class="card-head">
        <span class="card-name" id="cardName"></span>
        <span class="card-meta">Screen locked for 5 seconds</span>
      </header>
      <h1 class="line" id="line"></h1>
      <p class="goal"></p>
      <div class="options" id="options" hidden></div>
      <p class="status" id="status"></p>
    </section>
    <script src="beats.js"></script>
    <script>
      const { CAST, B, seg, lerp, ease } = window.LOCKIN_BOMB;
      const $ = (id) => document.getElementById(id);
      $('cardName').textContent = `Lock In bomb from ${CAST.me}`;
      $('line').textContent = CAST.line;
      const labels = ['Lock in for 25 minutes', `Bomb ${CAST.me} back`, 'Okay, okay'];
      labels.forEach((l, i) => {
        const b = document.createElement('button');
        b.className = `opt${i === 0 ? ' primary' : ''}`;
        b.type = 'button';
        b.innerHTML = `<kbd>${i + 1}</kbd>`;
        b.append(l);
        $('options').append(b);
      });

      // overlay.css's bomb-in keyframes, sampled by hand.
      const KEYS = [
        { at: 0, s: 1.35, r: -6, x: 0, o: 0 },
        { at: 0.55, s: 0.97, r: 3, x: 0, o: 1 },
        { at: 0.7, s: 1, r: 1, x: -8, o: 1 },
        { at: 0.85, s: 1, r: 2.5, x: 6, o: 1 },
        { at: 1, s: 1, r: 2, x: 0, o: 1 },
      ];
      function bombIn(k) {
        let i = 0;
        while (i < KEYS.length - 2 && k > KEYS[i + 1].at) i++;
        const a = KEYS[i];
        const b = KEYS[i + 1];
        const f = ease.out(Math.min(1, Math.max(0, (k - a.at) / (b.at - a.at))));
        return { s: lerp(a.s, b.s, f), r: lerp(a.r, b.r, f), x: lerp(a.x, b.x, f), o: lerp(a.o, b.o, f) };
      }

      window.render = (t) => {
        const on = t >= B.impact && t < B.cardOut[1];
        document.body.style.visibility = on ? 'visible' : 'hidden';
        if (!on) return;
        const out = ease.in(seg(t, B.cardOut[0], B.cardOut[1]));
        $('scrim').style.opacity = String(Math.min(1, seg(t, B.impact, B.impact + 0.12)) * (1 - out));
        const k = seg(t, B.impact, B.impact + 0.5);
        const p = bombIn(k);
        const card = $('card');
        card.style.opacity = String(p.o * (1 - out));
        card.style.transform = `translateX(${p.x}px) scale(${p.s * (1 - out * 0.06)}) rotate(${p.r}deg)`;
        const locked = t < B.unlock;
        card.classList.toggle('locked', locked);
        $('options').hidden = locked;
        const n = B.countdown.filter((c) => t >= c).length;
        $('status').textContent = locked ? `Locked for ${6 - Math.max(1, n)}…` : '';
        $('options').firstElementChild.classList.toggle('pressed', t >= B.click && t < B.click + 0.08);
      };

      window.primaryRect = () => $('options').firstElementChild.getBoundingClientRect().toJSON();
    </script>
  </body>
</html>
