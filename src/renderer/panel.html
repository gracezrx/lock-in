<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; script-src 'self'; img-src 'self' data:" />
    <title>Lock In</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="panel.css" />
  </head>
  <body>
    <main class="panel" id="panel" aria-label="Lock In">
      <header class="top">
        <div class="brand">
          <svg class="mark" aria-hidden="true" viewBox="0 0 1024 1024"><rect width="1024" height="1024" rx="230" fill="#0b0f13"/><g transform="translate(512 512) scale(0.82) translate(-512 -529)"><path d="M375 526V430a137 137 0 0 1 274 0V526" fill="none" stroke="#d4ff3a" stroke-width="70"/><rect x="292" y="486" width="440" height="314" rx="48" fill="#d4ff3a"/><circle cx="512" cy="615" r="42" fill="#0b0f13"/><rect x="491" y="622" width="42" height="94" rx="20" fill="#0b0f13"/></g></svg>
          <span>Lock In</span>
        </div>
        <div class="top-right">
          <span class="chip" id="muteChip" hidden></span>
          <button class="icon-btn" id="settingsBtn" type="button" title="Settings (⌘,)" aria-label="Settings">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3.2"/><path d="M19.4 13.5a7.6 7.6 0 0 0 0-3l2-1.6-2-3.4-2.4 1a7.7 7.7 0 0 0-2.6-1.5L14 2.5h-4l-.4 2.5A7.7 7.7 0 0 0 7 6.5l-2.4-1-2 3.4 2 1.6a7.6 7.6 0 0 0 0 3l-2 1.6 2 3.4 2.4-1a7.7 7.7 0 0 0 2.6 1.5l.4 2.5h4l.4-2.5a7.7 7.7 0 0 0 2.6-1.5l2.4 1 2-3.4z"/></svg>
          </button>
        </div>
      </header>

      <div class="scroll" id="scroll">
        <section class="alerts" id="alerts" hidden></section>
        <section class="hero" id="hero"></section>
        <section class="today" id="today"></section>
        <section class="block" id="todos"></section>
        <section class="block" id="goals" hidden></section>
        <section class="block" id="crew" hidden></section>
      </div>

      <footer class="foot">
        <button class="talk" id="talkBtn" type="button">
          <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/></svg>
          <span>Talk to Lock In</span>
          <kbd>⇧⌘Space</kbd>
        </button>
        <button class="icon-btn" id="quitBtn" type="button" title="Quit Lock In" aria-label="Quit Lock In">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>
        </button>
      </footer>
    </main>
    <script src="panel.js"></script>
  </body>
</html>
