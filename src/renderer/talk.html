<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; worker-src 'self' blob:; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; media-src 'self' blob: data:; connect-src 'self' https://*.elevenlabs.io wss://*.elevenlabs.io https://*.livekit.cloud wss://*.livekit.cloud ws://127.0.0.1:*"
    />
    <title>Talk to Lock In</title>
    <link rel="stylesheet" href="base.css" />
    <link rel="stylesheet" href="talk.css" />
  </head>
  <body>
    <article class="talk" id="talk" data-state="connecting">
      <header class="head">
        <div class="who">
          <span class="orb" id="orb" aria-hidden="true"><i></i></span>
          <div>
            <h1 class="title" id="title">Talk to Lock In</h1>
            <p class="status" id="status" aria-live="polite">Connecting…</p>
          </div>
        </div>
        <button class="close" id="close" type="button" aria-label="End the conversation">End</button>
      </header>
      <p class="notice" id="notice" hidden></p>
      <ol class="log" id="log" aria-live="polite"></ol>
      <div class="chips" id="chips" aria-live="polite"></div>
      <form class="say" id="say">
        <button class="mic" id="mic" type="button" aria-pressed="false" aria-label="Mute the microphone" title="Mute the microphone">
          <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z" fill="currentColor"/></svg>
        </button>
        <input id="input" type="text" autocomplete="off" placeholder="Or type: I sent the deck, called the bank…" aria-label="Type a message" />
        <button class="btn btn-ink send" type="submit">Send</button>
      </form>
    </article>
    <script src="talk.js"></script>
  </body>
</html>
